<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="#" class="logo">
            <img src="./assets/logo_connecta.png" alt="Logo Connecta">

            <div class="text_logo">
                <p class="title_logo">Connecta</p>
                <p class="subtitle-logo">Agenda de Contatos</p>
            </div>
        </a>

        <nav class="buttons_cta">
            <a href="#sobre" class="nav-link active">Sobre</a>
            <a href="#planos" class="nav-link">Planos</a>
            <a href="#contatos" class="nav-link">Contatos</a>
        </nav>

        <div class="header-buttons">
            <div class="search-box">
                <input type="text" placeholder="Buscar contatos..." aria-label="Buscar contatos">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
            </div>

            <button class="btn-login">Entrar</button>
            <button class="btn-primary">Começar Agora</button>
            <button class="hamburguer" id="btn-menu" aria-label="Abrir menu">☰</button>
        </div>
    </header>

    <script src="script.js"></script>
</body>

</html>
